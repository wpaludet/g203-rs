name: macos-build
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-latest   # Apple Silicon, Rust preinstalled
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: cargo build --release --locked --features rusb/vendored
      - uses: actions/upload-artifact@v7
        with:
          path: target/release/g203ctl
          archive: false
      - if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: >
          gh release create "$TAG" target/release/g203ctl --generate-notes
          || gh release upload "$TAG" target/release/g203ctl --clobber
